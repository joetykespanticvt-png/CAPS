<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPS Portal - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --caps-dark: #004b2d;
      --caps-primary: #006239;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <header class="h-20 bg-gradient-to-r from-emerald-950 to-emerald-900 text-white flex items-center justify-between px-6 shadow-md">
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-white/10 rounded-lg">
        <i data-lucide="home" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold leading-tight">CAPS Portal</h1>
        <p class="text-xs text-emerald-200">Your community, connected.</p>
      </div>
    </div>
    <a href="login.html" class="border border-white/80 text-xs font-semibold px-4 py-2 rounded-full hover:bg-white hover:text-emerald-950 transition">
      Sign in
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 my-6">
    <div class="w-full max-w-4xl bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden grid grid-cols-1 md:grid-cols-12">
      
      <div class="md:col-span-5 bg-gradient-to-br from-emerald-900 to-emerald-950 text-white p-8 flex flex-col justify-center text-center relative">
        <i data-lucide="home" class="w-16 h-16 mx-auto mb-4 text-emerald-400"></i>
        <h2 class="text-2xl font-extrabold mb-2">A closer community.</h2>
        <p class="text-xs text-emerald-100 leading-relaxed">A shared space for residents of Barangay San Antonio De Padua II to stay informed and connected.</p>
      </div>

      <div class="md:col-span-7 p-6 sm:p-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-1">Create your resident account</h2>
        <p class="text-xs text-slate-500 mb-6">Enter your details to join Barangay San Antonio De Padua II portal.</p>

        <form id="register-form" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">First name</label>
              <input type="text" id="reg-firstname" required placeholder="First name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Last name</label>
              <input type="text" id="reg-lastname" required placeholder="Last name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Email address</label>
              <input type="email" id="reg-email" required placeholder="Enter email" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile number</label>
              <input type="tel" id="reg-phone" required placeholder="Mobile no." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Residential address</label>
            <input type="text" id="reg-address" required placeholder="Purok / Street" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
              <input type="password" id="reg-pass" required minlength="6" placeholder="Password" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm password</label>
              <input type="password" id="reg-confirm-pass" required minlength="6" placeholder="Confirm Password" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
          </div>

          <div class="flex items-center space-x-2 text-xs">
            <input type="checkbox" id="reg-terms" required class="rounded border-slate-300">
            <label for="reg-terms" class="text-slate-600">I agree to the terms and privacy policy.</label>
          </div>

          <button type="submit" id="create-btn" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow">
            Create account
          </button>
        </form>
      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();

    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const fname = document.getElementById('reg-firstname').value.trim();
      const lname = document.getElementById('reg-lastname').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const address = document.getElementById('reg-address').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const confirmPass = document.getElementById('reg-confirm-pass').value;

      if (pass !== confirmPass) {
        alert('Passwords do not match!');
        return;
      }

      const users = JSON.parse(localStorage.getItem('caps_registered_users') || '[]');
      
      if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        alert('This email is already registered.');
        return;
      }

      users.push({
        firstName: fname,
        lastName: lname,
        email: email,
        phone: phone,
        address: address,
        password: pass
      });

      localStorage.setItem('caps_registered_users', JSON.stringify(users));
      alert('Account created successfully!');
      window.location.href = 'login.html?registered=true';
    });
  </script>
</body>
</html>
