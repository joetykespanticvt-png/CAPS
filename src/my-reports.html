<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CAPS Portal - My Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { caps: {
        50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d',950:'#052e16'
      } } } }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    ::selection { background: #bbf7d0; color: #14532d; }
    @keyframes capsFadeUp   { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
    @keyframes capsFadeIn   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes capsSlideDown{ from { opacity: 0; translate: 0 -100%; } to { opacity: 1; translate: 0 0; } }
    @keyframes capsSlideLeft{ from { opacity: 0; translate: -24px 0; } to { opacity: 1; translate: 0 0; } }
    @keyframes capsPop      { from { opacity: 0; scale: .94; translate: 0 8px; } to { opacity: 1; scale: 1; translate: 0 0; } }
    body > header { animation: capsSlideDown .5s cubic-bezier(.22,1,.36,1) both; }
    main > aside:first-child { animation: capsSlideLeft .6s cubic-bezier(.22,1,.36,1) .1s both; }
    header a.brand { transition: letter-spacing .3s ease, opacity .2s ease; }
    header a.brand:hover { letter-spacing: .16em; opacity: .9; }
    header button { transition: background-color .2s ease, translate .2s ease, box-shadow .2s ease; }
    header button:hover { translate: 0 -1px; box-shadow: 0 6px 14px -6px rgba(0,0,0,.4); }
    #user-avatar { transition: box-shadow .25s ease, scale .25s ease; }
    #user-avatar:hover { scale: 1.08; box-shadow: 0 0 0 3px rgba(187,247,208,.45); }
    main aside nav a { transition: background-color .25s ease, color .25s ease, translate .25s ease; }
    main aside nav a:hover { translate: 4px 0; }
    main aside nav a svg { transition: translate .25s ease, scale .25s ease; }
    main aside nav a:hover svg { scale: 1.12; }
    .cap-card { position: relative; overflow: hidden; transition: box-shadow .3s ease, translate .3s ease, border-color .3s ease; }
    .cap-card:hover { translate: 0 -2px; border-color: #bbf7d0; box-shadow: 0 14px 30px -14px rgba(22,101,52,.28); }
    .cap-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, #15803d, #22c55e); }
    #logout-modal { animation: capsFadeIn .2s ease both; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    #logout-modal > div { animation: capsPop .3s cubic-bezier(.22,1,.36,1) both; }
    a:focus-visible, button:focus-visible { outline: 2px solid #22c55e; outline-offset: 2px; }

    /* Mobile bottom navigation (same on every page) */
    .bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-size:10px;font-weight:500;color:#64748b;transition:color .2s ease,background-color .2s ease}
    .bn-item:active{background:#f0fdf4}
    .bn-item.active{color:#15803d;font-weight:700}
    .bn-item.active::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#15803d,#22c55e)}
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col pb-24 lg:pb-0">

  <header class="bg-caps-900 text-white sticky top-0 z-40 shadow-lg border-b border-caps-800">
    <div class="px-4 sm:px-6">
      <div class="flex items-center justify-between h-16 gap-4">
        <a href="dashboard.html" class="text-xl font-extrabold tracking-widest text-white">CAPS</a>
        <div class="flex items-center space-x-3">
          <a href="dashboard.html#notifications" title="Notifications" class="relative p-2 rounded-lg text-caps-200 hover:text-white hover:bg-white/10 transition"><i data-lucide="bell" class="w-5 h-5"></i><span id="bell-badge" class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">0</span></a>
          <a href="profile.html" class="w-8 h-8 rounded-full bg-caps-200 text-caps-900 font-bold flex items-center justify-center text-xs overflow-hidden shadow-sm hover:ring-2 hover:ring-white transition" id="user-avatar">JD</a>
          <div class="hidden lg:block text-left">
            <p class="text-xs font-semibold leading-tight text-white" id="user-display-name">Juan Dela Cruz</p>
            <p class="text-[10px] text-caps-200 font-medium">Verified Resident</p>
          </div>
          <button type="button" onclick="openLogoutModal()" title="Log Out" class="flex items-center space-x-1.5 text-white text-xs font-semibold px-3 py-1.5 rounded-lg bg-white/10 border border-white/20 hover:bg-white/20 transition">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Log Out</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full flex flex-col lg:flex-row">
    <aside class="hidden lg:block lg:w-80 lg:shrink-0 lg:sticky lg:top-16 lg:self-start lg:p-4">
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 px-2">Navigation</h3>
        <nav class="space-y-2">
          <a href="dashboard.html" class="flex items-center space-x-3.5 px-4 py-3.5 text-base rounded-xl font-semibold text-slate-600 hover:bg-slate-50 hover:text-caps-700 transition"><i data-lucide="rss" class="w-5 h-5"></i><span>Community Feed</span></a>
          <a href="my-reports.html" class="flex items-center space-x-3.5 px-4 py-3.5 text-base rounded-xl font-bold bg-caps-100 text-caps-700 nav-active"><i data-lucide="file-text" class="w-5 h-5"></i><span>My Reports</span></a>
          <a href="profile.html" class="flex items-center space-x-3.5 px-4 py-3.5 text-base rounded-xl font-semibold text-slate-600 hover:bg-slate-50 hover:text-caps-700 transition"><i data-lucide="user" class="w-5 h-5"></i><span>Profile Settings</span></a>
        </nav>
      </div>
    </aside>

    <section class="flex-1 min-w-0 px-4 sm:px-6 lg:px-10 py-6">
      <div class="w-full max-w-6xl space-y-6">
        <div id="my-reports-list" class="space-y-6"></div>
      </div>
    </section>
  </main>

  <!-- MOBILE BOTTOM NAVIGATION (identical on every page) -->
  <nav aria-label="Main navigation" class="fixed bottom-0 inset-x-0 z-40 lg:hidden grid grid-cols-5 bg-white border-t border-slate-200 shadow-[0_-6px_18px_-10px_rgba(0,0,0,.25)]" style="height:calc(4rem + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)">
    <a href="dashboard.html" class="bn-item"><i data-lucide="rss" class="w-5 h-5"></i><span>Feed</span></a>
    <a href="my-reports.html" class="bn-item active"><i data-lucide="file-text" class="w-5 h-5"></i><span>My Reports</span></a>
    <a href="dashboard.html#report" class="bn-item"><i data-lucide="plus-circle" class="w-5 h-5"></i><span>Report</span></a>
    <a href="dashboard.html#hotlines" class="bn-item"><i data-lucide="phone-call" class="w-5 h-5"></i><span>Hotlines</span></a>
    <a href="profile.html" class="bn-item"><i data-lucide="user" class="w-5 h-5"></i><span>Profile</span></a>
  </nav>

  <!-- LOGOUT CONFIRMATION MODAL -->
  <div id="logout-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/50 px-4" role="dialog" aria-modal="true" aria-labelledby="logout-title">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-sm p-6">
      <div class="w-10 h-10 rounded-full bg-red-50 text-red-600 flex items-center justify-center mb-3"><i data-lucide="log-out" class="w-5 h-5"></i></div>
      <h3 id="logout-title" class="text-base font-bold text-slate-900">Are you sure you want to log out?</h3>
      <p class="text-xs text-slate-500 mt-1">You will need to sign in again to access your account.</p>
      <div class="flex justify-end space-x-2 mt-5">
        <button type="button" onclick="closeLogoutModal()" class="px-4 py-2.5 text-xs font-semibold rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-50 transition">No</button>
        <button type="button" onclick="confirmLogout()" class="px-4 py-2.5 text-xs font-semibold rounded-lg bg-red-600 text-white hover:bg-red-700 transition">Yes</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import {
      esc, initialsOf, fmtDate, fmtDateTime, ms, docData, statusSteps, statusStyle, setAvatar,
      requireUser, logout, listenNotifications, toast, mediaHTML, hydrateMedia, deleteReportMedia
    } from "./caps-common.js";
    import {
      collection, query, where, onSnapshot, doc, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const { user, profile } = await requireUser();
    const me = user.uid;
    const myName = profile.fullName || user.displayName || 'Resident';
    document.getElementById('user-display-name').innerText = myName;
    setAvatar(document.getElementById('user-avatar'), profile.picture, initialsOf(myName));

    // Bell badge + pop-up when the admin updates one of my reports (or anyone comments / upvotes)
    listenNotifications(me, (items) => {
      const unread = items.filter(n => !n.read).length;
      const b = document.getElementById('bell-badge');
      b.innerText = unread > 9 ? '9+' : unread;
      b.classList.toggle('hidden', unread === 0);
    }, (n) => toast(n.text));

    let myReports = [];
    let commentsBy = {};
    const openComments = new Set();

    onSnapshot(query(collection(db, 'reports'), where('authorId', '==', me)), (snap) => {
      myReports = snap.docs.map(docData).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
      loadMyReports();
    }, (err) => {
      console.error(err);
      document.getElementById('my-reports-list').innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-xs">Could not load your reports (${esc(err.code || err.message)}). Make sure the latest Firestore rules are published.</div>`;
    });
    onSnapshot(collection(db, 'comments'), (snap) => {
      commentsBy = {};
      snap.docs.map(docData).forEach(c => { (commentsBy[c.reportId] = commentsBy[c.reportId] || []).push(c); });
      Object.values(commentsBy).forEach(l => l.sort((a, b) => ms(a.createdAt) - ms(b.createdAt)));
      loadMyReports();
    }, (err) => console.error('comments listener', err));

    function toggleComments(id) { openComments.has(id) ? openComments.delete(id) : openComments.add(id); loadMyReports(); }

    function commentHTML(c, rep) {
      const isOwner = c.authorId === rep.authorId;
      return `
        <div class="flex gap-2.5">
          <div class="w-7 h-7 rounded-full bg-caps-100 text-caps-800 border border-caps-200 font-bold text-[10px] flex items-center justify-center shrink-0">${esc(c.authorInitials)}</div>
          <div class="min-w-0 flex-1">
            <div class="bg-slate-50 border border-slate-200/70 rounded-2xl px-3 py-2">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs font-bold text-slate-900">${esc(c.authorName)}</span>
                ${isOwner ? '<span class="text-[9px] bg-caps-100 text-caps-800 px-1.5 py-0.5 rounded font-semibold border border-caps-200">You</span>' : ''}
              </div>
              <p class="text-xs text-slate-700 mt-0.5 leading-relaxed break-words">${esc(c.text)}</p>
            </div>
            <div class="px-2 mt-0.5 text-[10px] text-slate-400">${esc(fmtDateTime(c.createdAt))}</div>
          </div>
        </div>`;
    }

    function loadMyReports() {
      const box = document.getElementById('my-reports-list');
      if (!myReports.length) {
        box.innerHTML = `
          <div class="cap-card bg-white rounded-xl border border-slate-200 shadow-sm p-10 text-center space-y-3">
            <div class="w-12 h-12 bg-caps-50 rounded-full flex items-center justify-center mx-auto text-caps-600 border border-caps-100"><i data-lucide="inbox" class="w-6 h-6"></i></div>
            <h3 class="font-bold text-slate-800 text-sm">You haven't submitted any reports yet</h3>
            <p class="text-xs text-slate-500">Reports you post in the community feed will show up here.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      box.innerHTML = myReports.map(rep => {
        const status = rep.status || 'Pending';
        const comments = commentsBy[rep.id] || [];
        const open = openComments.has(rep.id);
        const idx = Math.max(0, statusSteps.indexOf(status));
        const steps = statusSteps.map((s, i) => `
          <div class="flex-1 flex flex-col items-center relative z-10">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${i <= idx ? 'bg-caps-600 text-white' : 'bg-slate-200 text-slate-400'}">${i <= idx ? '✓' : i + 1}</div>
            <span class="text-xs mt-1.5 text-center font-medium ${i <= idx ? 'text-caps-800 font-bold' : 'text-slate-400'}">${s}</span>
          </div>`).join('');
        return `
        <div class="cap-card bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
          <div class="flex justify-between items-start gap-3">
            <div class="min-w-0">
              <span class="text-xs font-bold text-caps-800 uppercase tracking-wider bg-caps-50 px-2.5 py-1 rounded border border-caps-100">${esc(rep.category)}</span>
              <h3 class="font-bold text-slate-900 text-xl mt-3 break-words">${esc(rep.title)}</h3>
              <p class="text-sm text-slate-400 mt-1">${esc(rep.purok)} • ${esc(fmtDate(rep.createdAt))}</p>
            </div>
            <span class="px-3.5 py-1.5 rounded-full text-xs font-bold border shrink-0 ${statusStyle[status] || statusStyle.Pending}">${esc(status)}</span>
          </div>
          <p class="text-sm text-slate-600 leading-relaxed break-words">${esc(rep.description)}</p>
          ${mediaHTML(rep)}
          <div class="bg-caps-50/60 p-6 rounded-xl border border-caps-100">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Progress Tracker</p>
            <div class="flex items-start justify-between relative">
              <div class="absolute top-4 h-0.5 bg-slate-200" style="left:12.5%;right:12.5%"></div>
              <div class="absolute top-4 h-0.5 bg-caps-600 transition-all" style="left:12.5%;width:${idx / 3 * 75}%"></div>
              ${steps}
            </div>
          </div>
          <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-sm">
            <div class="flex items-center gap-4 text-slate-500 font-medium">
              <span class="flex items-center gap-1.5"><i data-lucide="thumbs-up" class="w-4 h-4"></i>${(rep.upvoters || []).length}</span>
              <button onclick="toggleComments('${esc(rep.id)}')" class="flex items-center gap-1.5 font-semibold px-2.5 py-1 -my-1 rounded-lg hover:bg-caps-50 transition ${open ? 'text-caps-700 bg-caps-50' : 'text-slate-500 hover:text-caps-700'}"><i data-lucide="message-circle" class="w-4 h-4"></i><span>Comments (${comments.length})</span></button>
            </div>
            <button onclick="deleteReport('${esc(rep.id)}')" class="text-red-600 font-semibold flex items-center space-x-1.5 px-3 py-1.5 rounded-lg hover:bg-red-50 transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i><span>Delete Report</span>
            </button>
          </div>
          ${open ? `
          <div class="pt-3 border-t border-slate-100 space-y-3">
            ${comments.length ? comments.map(c => commentHTML(c, rep)).join('') : '<p class="text-[11px] text-slate-400 px-1">No comments on this report yet.</p>'}
          </div>` : ''}
        </div>`;
      }).join('');
      lucide.createIcons();
      hydrateMedia();
    }

    async function deleteReport(id) {
      if (!confirm('Are you sure you want to delete this report?')) return;
      try {
        await deleteReportMedia(id);
        await deleteDoc(doc(db, 'reports', id));
      } catch (err) {
        console.error(err);
        alert('Could not delete the report (' + (err.code || err.message) + ').');
      }
    }

    function openLogoutModal() { const m = document.getElementById('logout-modal'); m.classList.remove('hidden'); m.classList.add('flex'); }
    function closeLogoutModal() { const m = document.getElementById('logout-modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
    function confirmLogout() { logout(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLogoutModal(); });
    document.getElementById('logout-modal').addEventListener('click', function (e) { if (e.target === this) closeLogoutModal(); });
    Object.assign(window, { toggleComments, deleteReport, openLogoutModal, closeLogoutModal, confirmLogout });

    lucide.createIcons();
    loadMyReports();
  </script>
</body>
</html>
