<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPS Portal - My Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .bg-caps-primary { background-color: #0E5A36; }
    .text-caps-primary { color: #0E5A36; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="bg-caps-primary text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-white/10 rounded-xl flex items-center justify-center">
            <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-none">CAPS Portal</h1>
            <p class="text-[11px] text-emerald-100 hidden sm:block">Barangay San Antonio De Padua II</p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-full bg-emerald-200 text-emerald-900 font-bold flex items-center justify-center text-xs" id="user-avatar">JD</div>
          <p class="text-xs font-bold hidden lg:block" id="user-display-name">Juan Dela Cruz</p>
          <button onclick="logout()" title="Logout" class="text-emerald-200 hover:text-white p-1.5"><i data-lucide="log-out" class="w-4 h-4"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
    <aside class="lg:col-span-3 space-y-4">
      <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm">
        <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">Navigation</h3>
        <nav class="space-y-1">
          <a href="dashboard.html" class="w-full flex items-center space-x-2.5 px-3 py-2.5 text-xs font-medium rounded-xl text-slate-600 hover:bg-slate-50 transition">
            <i data-lucide="rss" class="w-4 h-4"></i>
            <span>Community Feed</span>
          </a>
          <a href="my-reports.html" class="w-full flex items-center space-x-2.5 px-3 py-2.5 text-xs font-bold rounded-xl bg-emerald-50 text-caps-primary border border-emerald-100">
            <i data-lucide="file-text" class="w-4 h-4"></i>
            <span>My Reports</span>
          </a>
          <a href="profile.html" class="w-full flex items-center space-x-2.5 px-3 py-2.5 text-xs font-medium rounded-xl text-slate-600 hover:bg-slate-50 transition">
            <i data-lucide="user" class="w-4 h-4"></i>
            <span>Profile Settings</span>
          </a>
        </nav>
      </div>
    </aside>

    <section class="lg:col-span-9 space-y-4">
      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-900">My Submitted Concerns</h2>
          <p class="text-xs text-slate-500">Track real-time progress steps and manage your reports.</p>
        </div>
        <a href="dashboard.html" class="bg-caps-primary text-white text-xs font-semibold px-4 py-2.5 rounded-xl hover:bg-emerald-800 transition flex items-center space-x-1.5 shadow">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>Submit New Report</span>
        </a>
      </div>

      <div id="my-reports-list" class="space-y-4"></div>
    </section>
  </main>

  <script>
    lucide.createIcons();

    const currentUser = JSON.parse(localStorage.getItem('currentUser')) || { name: 'Juan Dela Cruz', email: '' };
    document.getElementById('user-display-name').innerText = currentUser.name;
    document.getElementById('user-avatar').innerText = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase() || 'JD';

    const statusSteps = ['Pending', 'Under Review', 'In Progress', 'Resolved'];

    function loadMyReports() {
      const allReports = JSON.parse(localStorage.getItem('caps_reports') || '[]');
      const container = document.getElementById('my-reports-list');

      const myReports = allReports.filter(r => r.authorEmail === currentUser.email || r.authorName === currentUser.name);

      if (myReports.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200/80 p-10 text-center space-y-3">
            <h3 class="font-bold text-slate-800 text-sm">You haven't submitted any reports yet</h3>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      myReports.forEach(rep => {
        const currentStatus = rep.status || 'Pending';
        const currentStepIndex = statusSteps.indexOf(currentStatus) !== -1 ? statusSteps.indexOf(currentStatus) : 0;

        let trackerHTML = statusSteps.map((step, idx) => {
          const isCompleted = idx <= currentStepIndex;
          return `
            <div class="flex-1 flex flex-col items-center relative">
              <div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold z-10 ${
                isCompleted ? 'bg-emerald-700 text-white' : 'bg-slate-200 text-slate-400'
              }">
                ${isCompleted ? '✓' : idx + 1}
              </div>
              <span class="text-[10px] mt-1 text-center font-medium ${isCompleted ? 'text-emerald-800 font-bold' : 'text-slate-400'}">
                ${step}
              </span>
            </div>
          `;
        }).join('');

        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-100 uppercase inline-block">
                ${rep.category}
              </span>
              <h3 class="font-bold text-slate-900 text-base mt-2">${rep.title}</h3>
              <p class="text-xs text-slate-400 mt-0.5">${rep.purok} • ${rep.date || 'Just now'}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-bold border bg-amber-50 text-amber-800 border-amber-200">
              ${currentStatus}
            </span>
          </div>

          <p class="text-xs text-slate-600">${rep.description}</p>

          <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Progress Tracker</p>
            <div class="flex items-center justify-between relative">
              <div class="absolute top-3 left-6 right-6 h-0.5 bg-slate-200 z-0"></div>
              ${trackerHTML}
            </div>
          </div>

          <div class="pt-2 border-t border-slate-100 flex justify-end">
            <button onclick="deleteReport(${rep.id})" class="text-xs text-red-600 font-semibold flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-red-50">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              <span>Delete Report</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function deleteReport(id) {
      if (!confirm('Are you sure you want to delete this report?')) return;
      let reports = JSON.parse(localStorage.getItem('caps_reports') || '[]');
      reports = reports.filter(r => r.id !== id);
      localStorage.setItem('caps_reports', JSON.stringify(reports));
      loadMyReports();
    }

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = 'login.html';
    }

    loadMyReports();
  </script>
</body>
</html>
