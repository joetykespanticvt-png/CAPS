<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPS Portal - Profile Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .bg-caps-primary { background-color: #0F3854; }
    .text-caps-primary { color: #0F3854; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- TOP NAVIGATION HEADER -->
  <header class="bg-caps-primary text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-white/10 rounded-lg">
            <i data-lucide="home" class="w-6 h-6 text-white"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-none">CAPS Portal</h1>
            <p class="text-[11px] text-slate-300 font-medium">Barangay San Antonio De Padua II</p>
          </div>
        </div>

        <div class="flex items-center space-x-3">
          <div class="flex items-center space-x-2 border-l border-slate-700 pl-3">
            <div class="w-8 h-8 rounded-full bg-teal-400 text-slate-950 font-bold flex items-center justify-center text-xs" id="user-avatar">JD</div>
            <span class="hidden lg:inline text-xs font-semibold" id="user-display-name">Juan Dela Cruz</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- LEFT NAVIGATION SIDEBAR -->
    <aside class="lg:col-span-3 space-y-4">
      <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Navigation</h3>
        <nav class="space-y-1">
          <a href="dashboard.html" class="w-full flex items-center space-x-2.5 px-3 py-2.5 text-xs font-medium rounded-lg text-slate-600 hover:bg-slate-50 transition">
            <i data-lucide="rss" class="w-4 h-4"></i>
            <span>Community Feed</span>
          </a>
          <a href="my-reports.html" class="w-full flex items-center space-x-2.5 px-3 py-2.5 text-xs font-medium rounded-lg text-slate-600 hover:bg-slate-50 transition">
            <i data-lucide="file-text" class="w-4 h-4"></i>
            <span>My Reports</span>
          </a>
          <a href="profile.html" class="w-full flex items-center space-x-2.5 px-3 py-2.5 text-xs font-bold rounded-lg bg-slate-100 text-caps-primary">
            <i data-lucide="user" class="w-4 h-4"></i>
            <span>Profile Settings</span>
          </a>
        </nav>
      </div>
    </aside>

    <!-- CONTENT AREA -->
    <section class="lg:col-span-9 space-y-4">
      <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm">
        <h2 class="text-lg font-bold text-slate-900 mb-1">Resident Profile Settings</h2>
        <p class="text-xs text-slate-500 mb-6">Manage your resident credentials and contact details in Barangay San Antonio De Padua II.</p>

        <form onsubmit="saveProfile(event)" class="space-y-4 max-w-xl">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
              <input type="text" id="prof-name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
              <input type="email" id="prof-email" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Residential Address</label>
            <input type="text" id="prof-address" placeholder="Purok / Sitio, Street, Barangay San Antonio De Padua II" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile Number</label>
            <input type="tel" id="prof-phone" placeholder="09XX XXX XXXX" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
          </div>

          <div class="pt-2">
            <button type="submit" class="bg-caps-primary text-white text-xs font-semibold px-4 py-2.5 rounded-lg hover:bg-slate-800 transition">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </section>

  </main>

  <script>
    lucide.createIcons();

    const currentUser = JSON.parse(localStorage.getItem('currentUser')) || { name: 'Juan Dela Cruz', email: 'juan@example.com' };
    document.getElementById('user-display-name').innerText = currentUser.name;
    document.getElementById('user-avatar').innerText = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase();
    
    document.getElementById('prof-name').value = currentUser.name;
    document.getElementById('prof-email').value = currentUser.email;

    function saveProfile(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('prof-name').value;
      currentUser.email = document.getElementById('prof-email').value;
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      alert('Profile updated successfully!');
      window.location.reload();
    }
  </script>
</body>
</html>
