<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPS Portal - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .bg-caps-primary { background-color: #0E5A36; }
    .text-caps-primary { color: #0E5A36; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="bg-caps-primary text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-white/10 rounded-xl flex items-center justify-center">
            <i data-lucide="shield-alert" class="w-6 h-6 text-emerald-200"></i>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h1 class="font-bold text-lg leading-none">CAPS Portal Management</h1>
              <span class="bg-amber-400 text-slate-950 text-[10px] font-extrabold px-2 py-0.5 rounded">ADMIN</span>
            </div>
            <p class="text-[11px] text-emerald-100">Barangay San Antonio De Padua II</p>
          </div>
        </div>

        <button onclick="logout()" class="text-xs bg-emerald-900/60 hover:bg-emerald-900 border border-emerald-700 px-3.5 py-2 rounded-xl flex items-center space-x-1.5">
          <i data-lucide="log-out" class="w-4 h-4 text-emerald-200"></i>
          <span>Admin Logout</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
    <aside class="lg:col-span-3 space-y-4">
      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
        <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3">Overview</h3>
        <div class="bg-emerald-50/60 p-4 rounded-2xl border border-emerald-100 text-center">
          <span class="block text-3xl font-extrabold text-caps-primary" id="total-reports-count">0</span>
          <span class="text-xs text-emerald-800 font-semibold mt-1 block">Total Submissions</span>
        </div>
      </div>
    </aside>

    <section class="lg:col-span-9 space-y-4">
      <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-900">Resident Submissions & Action Panel</h2>
          <p class="text-xs text-slate-500">Update report progress stages or delete entries.</p>
        </div>
      </div>

      <div id="admin-reports-list" class="space-y-4"></div>
    </section>
  </main>

  <script>
    lucide.createIcons();

    const statusSteps = ['Pending', 'Under Review', 'In Progress', 'Resolved'];

    function renderAdminReports() {
      const reports = JSON.parse(localStorage.getItem('caps_reports') || '[]');
      const container = document.getElementById('admin-reports-list');
      document.getElementById('total-reports-count').innerText = reports.length;

      if (reports.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200/80 p-10 text-center space-y-2">
            <p class="font-bold text-slate-700 text-sm">No resident reports found</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      reports.forEach((rep, index) => {
        const currentStatus = rep.status || 'Pending';

        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-bold text-caps-primary bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-100 uppercase inline-block">
                ${rep.category}
              </span>
              <h3 class="font-bold text-slate-900 text-base mt-2">${rep.title}</h3>
              <p class="text-xs text-slate-500 mt-0.5">Submitted by: <strong>${rep.authorName || 'Resident'}</strong> • ${rep.purok} • ${rep.date || 'Just now'}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-bold border bg-amber-50 text-amber-800 border-amber-200">
              ${currentStatus}
            </span>
          </div>

          <p class="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100">${rep.description}</p>

          <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold text-slate-700">Update Status:</span>
              <select onchange="updateStatus(${rep.id}, this.value)" class="text-xs bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 font-semibold cursor-pointer">
                <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Under Review" ${currentStatus === 'Under Review' ? 'selected' : ''}>Under Review</option>
                <option value="In Progress" ${currentStatus === 'In Progress' ? 'selected' : ''}>In Progress</option>
                <option value="Resolved" ${currentStatus === 'Resolved' ? 'selected' : ''}>Resolved</option>
              </select>
            </div>

            <button onclick="deleteReport(${rep.id})" class="text-xs text-red-600 font-semibold flex items-center space-x-1 px-3 py-1.5 rounded-xl hover:bg-red-50">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              <span>Delete Submission</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function updateStatus(id, newStatus) {
      let reports = JSON.parse(localStorage.getItem('caps_reports') || '[]');
      const report = reports.find(r => r.id === id);
      if (report) {
        report.status = newStatus;
        localStorage.setItem('caps_reports', JSON.stringify(reports));
        renderAdminReports();
      }
    }

    function deleteReport(id) {
      if (!confirm('Are you sure you want to delete this report?')) return;
      let reports = JSON.parse(localStorage.getItem('caps_reports') || '[]');
      reports = reports.filter(r => r.id !== id);
      localStorage.setItem('caps_reports', JSON.stringify(reports));
      renderAdminReports();
    }

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = 'login.html';
    }

    renderAdminReports();
  </script>
</body>
</html>
